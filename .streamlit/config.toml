[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0a0d12"
secondaryBackgroundColor = "#0e1219"
textColor = "#e8ecf3"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
