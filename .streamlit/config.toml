[theme]
base = "dark"
primaryColor = "#00e5ff"
backgroundColor = "#04060d"
secondaryBackgroundColor = "#0b1226"
textColor = "#e8f1ff"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
